<!doctype html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="user-scalable=yes, initial-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>"
    />

    <link rel="icon" type="image/png" sizes="128x128" href="icons/favicon-128x128.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png" />
    <link rel="icon" type="image/ico" href="favicon.ico" />
    <style>
      /* Reserve the SPA shell before Vue mounts so late widgets do not sit at y=0. */
      html,
      body {
        margin: 0;
      }
      #q-app {
        min-height: 100vh;
      }
      .dlsite-blogparts {
        min-height: 280px;
      }
    </style>
    <script src="https://mo4koma.iranika.info/4komaData.js"></script>
    <script>
      (function () {
        var page = window.pageData && window.pageData[0];
        var url = page && page.ImagesUrl && page.ImagesUrl[0];
        if (!url) return;
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        link.type = 'image/webp';
        link.href = url.replace('/ja/', '/ja/webp/').replace('.jpg', '.webp');
        document.head.appendChild(link);
      })();
    </script>
    <script type="text/javascript">
      (function (c, l, a, r, i, t, y) {
        c[a] =
          c[a] ||
          function () {
            (c[a].q = c[a].q || []).push(arguments);
          };
        t = l.createElement(r);
        t.async = 1;
        t.src = 'https://www.clarity.ms/tag/' + i;
        y = l.getElementsByTagName(r)[0];
        y.parentNode.insertBefore(t, y);
      })(window, document, 'clarity', 'script', 'y20oiktcck');
    </script>
  </head>
  <body>
    <!-- quasar:entry-point -->

    <!-- DLsite Blog parts: reserved height so the widget does not shove the page -->
    <div class="dlsite-blogparts">
    <script type="text/javascript">
      blogparts = { id: '8585', ssl: '1' };
    </script>
    <script
      type="text/javascript"
      src="https://www.dlsite.com/js/blogparts.js"
      charset="UTF-8"
    ></script>
    </div>
    <script type="text/javascript">
      window.NREUM || (NREUM = {});
      NREUM.init = {
        distributed_tracing: { enabled: true },
        privacy: { cookies_enabled: true },
        ajax: { deny_list: ['bam.nr-data.net'] },
      };

      NREUM.loader_config = {
        accountID: '3278675',
        trustKey: '3278675',
        agentID: '601381007',
        licenseKey: 'NRJS-06933c7c19d58cc37ab',
        applicationID: '601381007',
      };
      NREUM.info = {
        beacon: 'bam.nr-data.net',
        errorBeacon: 'bam.nr-data.net',
        licenseKey: 'NRJS-06933c7c19d58cc37ab',
        applicationID: '601381007',
        sa: 1,
      };
    </script>
    <script src="https://js-agent.newrelic.com/nr-loader-spa-1228.min.js" defer></script>
  </body>
</html>
